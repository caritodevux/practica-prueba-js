<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de registro PetCare Valparaiso</title>
</head>
<body>
    <h1>PetCare Valparaiso</h1>
    <h2>Sistema de registro de pacientes</h2>
    <p>Por favor ingrese los datos del paciente:</p>
    <input type="text" id="ingresa-nombre" placeholder="nombre del paciente">
    <select id="seleccion-especie" name="Especie">
        <option value="perro">Canino</option>
        <option value="gato">Felino</option>
        <option value="ave">Ave</option>
    </select>
    <input type="number" id="ingresa-edad" placeholder="edad en años">
    <button id="btn-registrar">Registrar</button>
    <br>
    <p id="mensaje-feedback"></p>
    <br>
    <h2>Pacientes registrados</h2>
    <ul id="lista-pacientes"></ul>
    <script src="script.js"></script>
</body>
</html>
